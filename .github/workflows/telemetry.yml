name: telemetry

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'generate.mjs'
      - '.github/workflows/telemetry.yml'

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependencies to install — the script uses node builtins and fetch.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # TELEMETRY_TOKEN is a fine-grained PAT; without it the built-in token
      # still works but only sees public activity.
      - name: generate
        env:
          GITHUB_TOKEN: ${{ secrets.TELEMETRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: node generate.mjs

      - name: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telemetry.json assets
          git diff --cached --quiet && echo 'nothing changed' && exit 0
          git commit -m 'refresh telemetry'
          git push
